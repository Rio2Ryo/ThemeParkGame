<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ThemeParkGame</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0c1a; }

    #unity-container {
      position: absolute; width: 100%; height: 100%;
    }
    #unity-canvas {
      width: 100%; height: 100%;
      background: #0a0c1a;
      cursor: default;
    }

    /* ローディング画面 */
    #loading-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0a0c1a 0%, #1a1040 40%, #0a1a3a 100%);
      z-index: 100;
      transition: opacity 0.8s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }

    .park-icon {
      font-size: 64px; margin-bottom: 16px;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .title {
      font-size: 36px; font-weight: 700;
      background: linear-gradient(90deg, #ffd700, #ff8c00, #ffd700);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 8px;
      text-shadow: none;
    }
    .subtitle {
      font-size: 16px; color: #8090b0; margin-bottom: 40px;
      letter-spacing: 2px;
    }

    /* プログレスバー */
    .progress-container {
      width: 320px; max-width: 80%;
    }
    .progress-bar-bg {
      width: 100%; height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #4a90d9, #64d8cb, #ffd700);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .progress-text {
      margin-top: 12px; font-size: 14px; color: #607090;
      text-align: center;
    }

    .hint {
      position: absolute; bottom: 24px;
      font-size: 12px; color: #405060;
      text-align: center; width: 100%;
    }

    /* 装飾パーティクル */
    .particles {
      position: absolute; width: 100%; height: 100%; overflow: hidden;
      pointer-events: none;
    }
    .particle {
      position: absolute; border-radius: 50%;
      animation: float linear infinite;
      opacity: 0.3;
    }
    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loading-screen">
    <div class="particles" id="particles"></div>
    <div class="park-icon">🎡</div>
    <div class="title">テーマパークゲーム</div>
    <div class="subtitle">THEME PARK GAME</div>
    <div class="progress-container">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-text" id="progress-text">読み込み中...</div>
    </div>
    <div class="hint">WebGL対応ブラウザ推奨 | Chrome / Edge / Firefox</div>
  </div>

  <script>
    // 装飾パーティクル生成
    (function() {
      var container = document.getElementById('particles');
      var colors = ['#ffd700', '#ff6b6b', '#64d8cb', '#4a90d9', '#ff8c00'];
      for (var i = 0; i < 20; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        var size = 4 + Math.random() * 8;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.animationDuration = (8 + Math.random() * 12) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        container.appendChild(p);
      }
    })();

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/ThemeParkGame.loader.js";
    var config = {
      dataUrl: buildUrl + "/f734834f8a1dc4054f99a0b5b8cf1c53.data",
      frameworkUrl: buildUrl + "/87e931f48e39b16bd5c1d302061bed9b.js",
      codeUrl: buildUrl + "/f59804aa9887c188d5aa169ce37043a3.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "ThemeParkGame",
      productName: "ThemeParkGame",
      productVersion: "0.1",
    };

    var progressFill = document.getElementById("progress-fill");
    var progressText = document.getElementById("progress-text");
    var loadingScreen = document.getElementById("loading-screen");

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function() {
      createUnityInstance(document.querySelector("#unity-canvas"), config, function(progress) {
        var pct = Math.round(progress * 100);
        progressFill.style.width = pct + "%";
        if (pct < 30) {
          progressText.textContent = "アセット読み込み中... " + pct + "%";
        } else if (pct < 70) {
          progressText.textContent = "ゲームデータ構築中... " + pct + "%";
        } else if (pct < 100) {
          progressText.textContent = "パーク準備中... " + pct + "%";
        } else {
          progressText.textContent = "開園準備完了！";
        }
      }).then(function(unityInstance) {
        loadingScreen.classList.add("hidden");
        setTimeout(function() { loadingScreen.style.display = "none"; }, 1000);
      }).catch(function(message) {
        progressText.textContent = "読み込みエラー: " + message;
        progressFill.style.background = "#ff4444";
        alert("ゲームの読み込みに失敗しました。\nページを再読み込みしてください。\n\n" + message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
