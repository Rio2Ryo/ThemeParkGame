name: Unity License Setup Info
on:
  workflow_dispatch:
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: How to set up Unity license
        run: |
          echo '=== Unity License Setup ==='
          echo 'Set the following GitHub Secrets:'
          echo '  UNITY_LICENSE  : contents of Unity_lic.ulf file'
          echo '  UNITY_EMAIL    : your Unity account email'
          echo '  UNITY_PASSWORD : your Unity account password'
          echo ''
          echo 'Then push to master to trigger the WebGL build.'
