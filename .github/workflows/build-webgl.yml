name: Build WebGL and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    name: Build Unity WebGL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      # -----------------------------------------------------------
      # 1. チェックアウト
      # -----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # -----------------------------------------------------------
      # 2. キャッシュ (Library フォルダ)
      # -----------------------------------------------------------
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # -----------------------------------------------------------
      # 3-A. ライセンスアクティベーション (UNITY_LICENSE が未設定の場合)
      #      Unity Personal License を使って手動アクティベーション
      # -----------------------------------------------------------
      - name: Request Unity activation file
        id: getManualLicenseFile
        if: ${{ env.UNITY_LICENSE == '' }}
        uses: game-ci/unity-request-activation-file@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 2021.3.35f1

      - name: Upload activation file as artifact
        if: steps.getManualLicenseFile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Unity_Activation_File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}

      - name: Fail with activation instructions
        if: ${{ env.UNITY_LICENSE == '' }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "::error::UNITY_LICENSE シークレットが設定されていません。"
          echo ""
          echo "=== ライセンスアクティベーション手順 ==="
          echo "1. このワークフローの Artifacts から Unity_Activation_File をダウンロード"
          echo "2. https://license.unity3d.com/manual にアクセス"
          echo "3. .alf ファイルをアップロードして .ulf ファイルを取得"
          echo "4. .ulf ファイルの内容を GitHub Secrets の UNITY_LICENSE に設定"
          echo "5. ワークフローを再実行"
          echo ""
          echo "詳細は WEBGL_SETUP.md を参照してください。"
          exit 1

      # -----------------------------------------------------------
      # 3-B. Unity WebGL ビルド
      # -----------------------------------------------------------
      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.35f1
          targetPlatform: WebGL
          buildName: ThemeParkGame
          buildsPath: build

      # -----------------------------------------------------------
      # 4. ビルド成果物のアップロード (デバッグ用)
      # -----------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/WebGL
          retention-days: 14

      # -----------------------------------------------------------
      # 5. GitHub Pages へデプロイ (gh-pages ブランチ)
      # -----------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/WebGL/ThemeParkGame
          clean: true
          commit-message: "deploy: WebGL build ${{ github.sha }}"
