name: Build WebGL and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    name: Build Unity WebGL
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------
      # 1. チェックアウト (shallow clone でメモリ節約)
      # -----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      # -----------------------------------------------------------
      # 2. キャッシュ (Library フォルダ)
      # -----------------------------------------------------------
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # -----------------------------------------------------------
      # 3. メモリ最適化: swap 拡張 (OOM killer 対策)
      # -----------------------------------------------------------
      - name: Free disk space and extend swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap extended to 10GB"
          free -h

      # -----------------------------------------------------------
      # 4. Unity WebGL ビルド (カスタムビルドメソッド使用)
      # -----------------------------------------------------------
      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.35f1
          targetPlatform: WebGL
          buildName: ThemeParkGame
          buildsPath: build
          buildMethod: ThemeParkGame.Editor.WebGLBuilder.Build
          customParameters: -buildPath build/WebGL/ThemeParkGame

      # -----------------------------------------------------------
      # 5. ビルド成果物のアップロード (デバッグ用)
      # -----------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/WebGL
          retention-days: 14

      # -----------------------------------------------------------
      # 6. GitHub Pages へデプロイ (gh-pages ブランチ)
      # -----------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/WebGL/ThemeParkGame
          clean: true
          commit-message: 'deploy: WebGL build ${{ github.sha }}'
